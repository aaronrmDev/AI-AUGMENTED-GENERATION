[project]
name = "unified-rag-cag-mag"
version = "0.1.0"
description = "Unified RAG x CAG x MAG AI System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "redis>=5.0",
    "email-validator>=2.1",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "pgvector>=0.3",
    "pypdf>=4.2",
    "tiktoken>=0.7",
    # >=1.0, not >=0.40: anthropic 1.0.0 is what this sub-project was built and
    # verified against, and the 0.x -> 1.x major carried breaking API changes,
    # so a 0.x resolution is not a version this code has ever run on.
    "anthropic>=1.0",
    "python-multipart>=0.0.9",
    "ollama>=0.6.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # >=0.24, not >=0.23: tests/integration/test_auth_endpoints.py uses
    # `pytest.mark.asyncio(loop_scope="module")`, and `loop_scope` was only
    # introduced in 0.24 — a 0.23.x resolution would fail at collection time.
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers>=4.5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a function call in a default argument
# (`session: AsyncSession = Depends(get_raw_db_session)`), which B008 flags by
# design. The rule exists to catch a mutable default evaluated once at import
# time; FastAPI's markers are inert value objects the framework resolves per
# request, so the hazard the rule guards against does not apply. Suppress it for
# these specific callables rather than refactoring working DI to appease a lint.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
# 3.12, not 3.11 (the requires-python floor): numpy — pulled in transitively by
# sentence-transformers — ships stubs written in 3.12+ syntax, and mypy parses
# them under whatever python_version is configured. Pinned at "3.11" it fails
# with a bare syntax error inside numpy before checking a single line of this
# project's own code, which makes the whole check unrunnable rather than strict.
python_version = "3.12"
strict = true
exclude = ["tests/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
