name: rag-parent-doc-compression
questions:
  - question: >-
      According to RAG.md, what is Parent Document Retrieval's mechanic for
      keeping search precise while still giving the LLM complete context, and
      what is its own expected impact figure, measured in isolation?
    success_criterion: >-
      Answer states that Parent Document Retrieval searches against small
      chunks for precision, then maps each top result back to its parent
      document/section before it reaches the LLM, and that its expected
      impact in isolation is a +15-20% gain in completeness (RAG.md: "The
      mechanic is to search against small chunks for precision, then map
      each top result back to its parent document, page, or section before
      sending anything to the LLM, so retrieval stays precise while the
      model still receives complete context." ... "Its expected impact in
      isolation is a +15-20% gain in completeness.").
  - question: >-
      RAG.md gives two different numbers for Context Compression's payoff
      and is explicit that they shouldn't be conflated: one from its
      specific 40-chunks-to-8 worked example, and one as its more general,
      cross-deployment expected-impact figure. What are both numbers, and
      which one is the general expected-impact figure rather than the
      worked example?
    success_criterion: >-
      Answer states the worked example's reduction is roughly -75% in token
      usage (for the specific 40-to-8-chunks case), and separately states
      the more general, cross-deployment expected-impact figure is a more
      conservative -50% in tokens with about a +10% gain in focus, keeping
      the two numbers distinct rather than conflated (RAG.md: "Two different
      numbers describe its payoff and shouldn't be conflated: the source's
      specific worked example of shrinking 40 retrieved chunks down to 8
      puts the reduction at roughly -75% in token usage for that particular
      case, with a corresponding rise in answer quality; its more general,
      cross-deployment expected-impact figure is a more conservative -50% in
      tokens with about a +10% gain in focus.").
  - question: >-
      What does RAG.md call the Parent Document + Context Compression
      combination, and why does pairing the two land closer to the sweet
      spot than either one alone?
    success_criterion: >-
      Answer states the combination is described as "the perfect balance"
      for complete yet compact context, and explains that Parent Document
      trades precision for completeness by expanding chunks (adding
      tokens) while Compression trims that expansion back down without
      losing the completeness Parent Document retrieved (RAG.md: "**Parent
      Document + Context Compression** — described as 'the perfect
      balance' for complete yet compact context. Parent Document
      deliberately trades precision for completeness by expanding small
      chunks into larger parent sections, which necessarily adds tokens;
      Compression trims exactly that expansion back down, removing the
      redundancy and noise the larger parent sections introduce without
      losing the completeness Parent Document was retrieved for in the
      first place.").
  - question: >-
      According to RAG.md's implementation roadmap, what happens to context
      quality when the intermediate phase adds Parent Document Retrieval and
      Context Compression together, and in what two specific ways?
    success_criterion: >-
      Answer states that context quality improves "dramatically," with
      answers becoming more complete and more focused at the same time
      (RAG.md: "The source describes the payoff as context quality
      improving 'dramatically,' with answers becoming more complete and
      more focused at the same time.").
  - question: >-
      What three situations does RAG.md recommend using Parent Document
      Retrieval for?
    success_criterion: >-
      Answer names very small chunks (100-300 tokens), documents that lean
      heavily on cross-references, and questions whose answers genuinely
      need full surrounding context (RAG.md: "The source recommends this
      specifically for very small chunks (100-300 tokens), documents that
      lean heavily on cross-references, and questions whose answers
      genuinely need full surrounding context.").
