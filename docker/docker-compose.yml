services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: unified_ai
      POSTGRES_PASSWORD: unified_ai
      POSTGRES_DB: unified_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # v1.9.0 predates Qdrant's unified Query API (introduced in v1.10) that
    # qdrant_client.query_points() (used by QdrantVectorStore.search) relies
    # on — a client running that call against a v1.9 server gets a bare 404,
    # discovered during Task 15's live Docker Compose smoke test. v1.16.2
    # matches the version testcontainers.qdrant.QdrantContainer's default
    # image already used throughout every real integration test in this
    # sub-project (Task 6), so this pin is the version actually validated.
    image: qdrant/qdrant:v1.16.2
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      # DATABASE_URL is the bootstrap superuser connection — used only for
      # `alembic upgrade head` below, which needs to CREATE TABLE/EXTENSION
      # and provision the app_user role itself. APP_DATABASE_URL is what
      # src/api/dependencies.py actually connects with at runtime: a
      # non-superuser, non-owner role, because PostgreSQL exempts both a
      # superuser and a table owner from row-level security regardless of
      # how correct the policy is (docs/superpowers/plans/2026-08-22-auth-
      # foundation.md, Task 5). Running the API itself as the superuser
      # would make every RLS policy in this system silently inert.
      DATABASE_URL: postgresql+asyncpg://unified_ai:unified_ai@postgres:5432/unified_ai
      APP_DATABASE_URL: postgresql+asyncpg://app_user:${APP_DB_PASSWORD}@postgres:5432/unified_ai
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5}
      # This compose file publishes the API on plain HTTP (see `ports:` below).
      # The refresh-token cookie defaults to Secure, which browsers and HTTP
      # clients alike withhold on a plain-http:// connection — without this
      # override, /auth/refresh never receives the cookie it just set and the
      # smoke test (tests/integration/test_docker_compose_smoke.py) fails at
      # that step. Never set this to false behind a real TLS-terminating proxy.
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      # The upload path LocalFileStorage writes (storage/{tenant_id}/
      # {document_id}/{filename}) is relative to the image's WORKDIR, /app.
      # Left on the container's own writable layer it dies with the container,
      # while the Documents.storage_path recorded in Postgres survives -- so a
      # `docker compose down` leaves every stored row pointing at a file that
      # no longer exists. A named volume gives the bytes the same lifetime as
      # the rows that reference them.
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  api_storage:
